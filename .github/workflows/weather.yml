name: Qom Weather Auto Capturer

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  capture-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: تنظیم نسخه پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب ابزارها و مرورگر
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: گرفتن عکس‌ها و ارسال به تلگرام
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || secrets.TELEGRAM_CHANNEL_ID }}
        run: python bot.py
